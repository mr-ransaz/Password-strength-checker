[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "password-strength-checker"
version = "0.1.1"
description = "A stdlib-only CLI with private password input and explainable strength estimates."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Your Name" }]
dependencies = []
keywords = ["password", "security", "cli", "entropy", "education", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/password-strength-checker"
Repository = "https://github.com/YOUR_USERNAME/password-strength-checker"
Issues = "https://github.com/YOUR_USERNAME/password-strength-checker/issues"
Changelog = "https://github.com/YOUR_USERNAME/password-strength-checker/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=7", "ruff>=0.14"]

[project.scripts]
pwcheck = "pwcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pwcheck = ["data/common_passwords.txt", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --cov=pwcheck --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["pwcheck"]
branch = true

[tool.coverage.report]
fail_under = 90
precision = 2

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
